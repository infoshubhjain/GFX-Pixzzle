<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixzzle - Turn Any Photo Into a Puzzle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1200px;
            width: 100%;
            padding: 40px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 3em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .upload-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
            margin-bottom: 20px;
        }

        .upload-box:hover {
            border-color: #764ba2;
            background: #f0f1ff;
        }

        .upload-box.dragover {
            border-color: #764ba2;
            background: #e8e9ff;
            transform: scale(1.02);
        }

        #fileInput {
            display: none;
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-weight: 600;
            color: #333;
        }

        select, button {
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid #667eea;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }

        select {
            background: white;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .game-area {
            display: none;
            gap: 20px;
            align-items: flex-start;
        }

        .pieces-container {
            flex: 1;
            background: #f8f9ff;
            border-radius: 15px;
            padding: 20px;
            min-height: 500px;
            border: 3px solid #667eea;
        }

        .pieces-container h3 {
            margin-bottom: 15px;
            color: #667eea;
        }

        .pieces-area {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 400px;
            padding: 10px;
            background: white;
            border-radius: 10px;
        }

        .pieces-area.drag-over {
            background: #e8e9ff;
            border: 2px dashed #667eea;
        }

        .puzzle-board-container {
            flex: 1.5;
        }

        .puzzle-board {
            background: #fff;
            border-radius: 15px;
            padding: 20px;
            display: grid;
            gap: 3px;
            border: 3px solid #667eea;
            aspect-ratio: 1;
            max-width: 600px;
            margin: 0 auto;
        }

        .puzzle-piece {
            cursor: grab;
            border-radius: 5px;
            transition: all 0.2s;
            background-size: cover;
            background-position: center;
            border: 2px solid #667eea;
            width: 100px;
            height: 100px;
            flex-shrink: 0;
        }

        .puzzle-piece:active {
            cursor: grabbing;
        }

        .puzzle-piece:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.5);
            z-index: 10;
        }

        .puzzle-piece.dragging {
            opacity: 0.3;
        }

        .puzzle-slot {
            border: 3px dashed #ccc;
            border-radius: 5px;
            background: #f8f9ff;
            transition: all 0.2s;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .puzzle-slot.drag-over {
            background: #d0d4ff;
            border-color: #667eea;
            border-style: solid;
            transform: scale(1.05);
        }

        .puzzle-slot.filled {
            border: 2px solid #667eea;
            background: transparent;
        }

        .puzzle-slot.filled .puzzle-piece {
            width: 100%;
            height: 100%;
            border: none;
            cursor: grab;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 10px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
        }

        .victory {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .victory-content {
            background: white;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            animation: popIn 0.5s;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .victory h2 {
            font-size: 3em;
            color: #667eea;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .game-area {
                flex-direction: column;
            }
            
            .header h1 {
                font-size: 2em;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧩 Pixzzle</h1>
            <p>Turn any photo into a fun jigsaw puzzle!</p>
        </div>

        <div class="upload-section" id="uploadSection">
            <div class="upload-box" id="uploadBox">
                <div class="upload-icon">📸</div>
                <h3>Click or drag an image here</h3>
                <p>Support for JPG, PNG, GIF, WebP</p>
                <input type="file" id="fileInput" accept="image/*">
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="difficulty">Difficulty:</label>
                <select id="difficulty">
                    <option value="3">Easy (3×3)</option>
                    <option value="4" selected>Medium (4×4)</option>
                    <option value="5">Hard (5×5)</option>
                    <option value="6">Expert (6×6)</option>
                </select>
            </div>
            <button id="startBtn" disabled>Start Puzzle</button>
            <button id="newGameBtn" style="display: none;">New Puzzle</button>
        </div>

        <div class="game-area" id="gameArea">
            <div class="pieces-container">
                <h3>🧩 Puzzle Pieces</h3>
                <div class="pieces-area" id="piecesArea"></div>
            </div>
            <div class="puzzle-board-container">
                <div class="puzzle-board" id="puzzleBoard"></div>
                <div class="stats">
                    <div class="stat">
                        <div class="stat-value" id="moves">0</div>
                        <div class="stat-label">Moves</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="timer">00:00</div>
                        <div class="stat-label">Time</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="progress">0%</div>
                        <div class="stat-label">Progress</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="victory" id="victory">
        <div class="victory-content">
            <h2>🎉 Puzzle Complete!</h2>
            <p style="font-size: 1.5em; margin: 20px 0;">
                Time: <span id="finalTime"></span><br>
                Moves: <span id="finalMoves"></span>
            </p>
            <button onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script>
        let uploadedImage = null;
        let gridSize = 4;
        let pieces = [];
        let moves = 0;
        let startTime = null;
        let timerInterval = null;
        let placedPieces = 0;
        let draggedElement = null;
        let draggedFromSlot = null;

        const uploadBox = document.getElementById('uploadBox');
        const fileInput = document.getElementById('fileInput');
        const startBtn = document.getElementById('startBtn');
        const newGameBtn = document.getElementById('newGameBtn');
        const uploadSection = document.getElementById('uploadSection');
        const gameArea = document.getElementById('gameArea');
        const difficulty = document.getElementById('difficulty');

        // Upload handling
        uploadBox.addEventListener('click', () => fileInput.click());
        
        uploadBox.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadBox.classList.add('dragover');
        });

        uploadBox.addEventListener('dragleave', () => {
            uploadBox.classList.remove('dragover');
        });

        uploadBox.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadBox.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                loadImage(file);
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                loadImage(file);
            }
        });

        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadedImage = e.target.result;
                uploadBox.innerHTML = `
                    <img src="${uploadedImage}" style="max-width: 100%; max-height: 200px; border-radius: 10px;">
                    <p style="margin-top: 10px;">Image loaded! Click "Start Puzzle" to begin.</p>
                `;
                startBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }

        difficulty.addEventListener('change', (e) => {
            gridSize = parseInt(e.target.value);
        });

        startBtn.addEventListener('click', startPuzzle);
        newGameBtn.addEventListener('click', () => location.reload());

        function startPuzzle() {
            uploadSection.style.display = 'none';
            gameArea.style.display = 'flex';
            startBtn.style.display = 'none';
            newGameBtn.style.display = 'block';
            
            gridSize = parseInt(difficulty.value);
            createPuzzle();
            startTimer();
        }

        function createPuzzle() {
            const board = document.getElementById('puzzleBoard');
            const piecesArea = document.getElementById('piecesArea');
            
            board.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            board.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;
            
            board.innerHTML = '';
            piecesArea.innerHTML = '';
            pieces = [];
            
            const totalPieces = gridSize * gridSize;

            piecesArea.addEventListener('dragover', handlePiecesAreaDragOver);
            piecesArea.addEventListener('dragleave', handlePiecesAreaDragLeave);
            piecesArea.addEventListener('drop', handlePiecesAreaDrop);

            for (let i = 0; i < totalPieces; i++) {
                const slot = document.createElement('div');
                slot.className = 'puzzle-slot';
                slot.dataset.position = i;
                
                slot.addEventListener('dragover', handleSlotDragOver);
                slot.addEventListener('dragleave', handleSlotDragLeave);
                slot.addEventListener('drop', handleSlotDrop);
                
                board.appendChild(slot);
            }

            for (let i = 0; i < totalPieces; i++) {
                const piece = document.createElement('div');
                piece.className = 'puzzle-piece';
                piece.draggable = true;
                piece.dataset.correctPosition = i;
                
                const row = Math.floor(i / gridSize);
                const col = i % gridSize;
                const percentX = (col / (gridSize - 1)) * 100;
                const percentY = (row / (gridSize - 1)) * 100;
                
                piece.style.backgroundImage = `url(${uploadedImage})`;
                piece.style.backgroundPosition = `${percentX}% ${percentY}%`;
                piece.style.backgroundSize = `${gridSize * 100}%`;
                
                piece.addEventListener('dragstart', handlePieceDragStart);
                piece.addEventListener('dragend', handlePieceDragEnd);
                
                pieces.push(piece);
            }

            shuffleArray(pieces);
            pieces.forEach(piece => piecesArea.appendChild(piece));
            
            moves = 0;
            placedPieces = 0;
            updateStats();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function handlePieceDragStart(e) {
            draggedElement = e.target;
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', e.target.innerHTML);
            
            const parentSlot = e.target.closest('.puzzle-slot');
            if (parentSlot) {
                draggedFromSlot = parentSlot;
            }
        }

        function handlePieceDragEnd(e) {
            e.target.classList.remove('dragging');
        }

        function handlePiecesAreaDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            e.currentTarget.classList.add('drag-over');
        }

        function handlePiecesAreaDragLeave(e) {
            if (e.target.id === 'piecesArea') {
                e.currentTarget.classList.remove('drag-over');
            }
        }

        function handlePiecesAreaDrop(e) {
            e.preventDefault();
            e.stopPropagation();
            
            const piecesArea = document.getElementById('piecesArea');
            piecesArea.classList.remove('drag-over');
            
            if (draggedElement) {
                if (draggedFromSlot) {
                    draggedFromSlot.classList.remove('filled');
                    
                    if (draggedElement.style.opacity === '1' && 
                        draggedElement.dataset.correctPosition === draggedFromSlot.dataset.position) {
                        placedPieces--;
                    }
                    
                    draggedFromSlot = null;
                }
                
                draggedElement.style.opacity = '1';
                draggedElement.style.width = '100px';
                draggedElement.style.height = '100px';
                draggedElement.draggable = true;
                draggedElement.style.cursor = 'grab';
                
                piecesArea.appendChild(draggedElement);
                
                moves++;
                updateStats();
            }
            
            draggedElement = null;
        }

        function handleSlotDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            
            const slot = e.currentTarget;
            if (!slot.classList.contains('filled')) {
                slot.classList.add('drag-over');
            }
        }

        function handleSlotDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function handleSlotDrop(e) {
            e.preventDefault();
            e.stopPropagation();
            
            const slot = e.currentTarget;
            slot.classList.remove('drag-over');
            
            if (draggedElement && !slot.classList.contains('filled')) {
                const pieceCorrectPosition = draggedElement.dataset.correctPosition;
                const slotPosition = slot.dataset.position;
                
                if (draggedFromSlot) {
                    draggedFromSlot.classList.remove('filled');
                    
                    if (draggedElement.style.opacity === '1' && 
                        draggedElement.dataset.correctPosition === draggedFromSlot.dataset.position) {
                        placedPieces--;
                    }
                    
                    draggedFromSlot = null;
                }
                
                slot.appendChild(draggedElement);
                slot.classList.add('filled');
                
                draggedElement.style.width = '100%';
                draggedElement.style.height = '100%';
                draggedElement.draggable = true;
                draggedElement.style.cursor = 'grab';
                
                moves++;
                
                if (pieceCorrectPosition === slotPosition) {
                    placedPieces++;
                    draggedElement.style.opacity = '1';
                    
                    if (placedPieces === gridSize * gridSize) {
                        setTimeout(winGame, 300);
                    }
                } else {
                    draggedElement.style.opacity = '0.6';
                }
                
                updateStats();
            }
            
            draggedElement = null;
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                document.getElementById('timer').textContent = 
                    `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }, 1000);
        }

        function updateStats() {
            document.getElementById('moves').textContent = moves;
            const progress = Math.round((placedPieces / (gridSize * gridSize)) * 100);
            document.getElementById('progress').textContent = progress + '%';
        }

        function winGame() {
            clearInterval(timerInterval);
            document.getElementById('finalTime').textContent = 
                document.getElementById('timer').textContent;
            document.getElementById('finalMoves').textContent = moves;
            document.getElementById('victory').style.display = 'flex';
        }
    </script>
</body>
</html>
